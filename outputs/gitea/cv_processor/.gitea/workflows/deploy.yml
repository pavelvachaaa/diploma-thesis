name: Deploy

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build_and_push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      image_ref: ${{ steps.image.outputs.image_ref }}
      registry_host: ${{ steps.image.outputs.registry_host }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          github-server-url: https://gitea.kzcr.eu

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve release tag
        id: release
        env:
          GITEA_REF: ${{ gitea.ref }}
        run: |
          set -eu
          : "${GITEA_REF:?Missing gitea.ref context}"

          TAG_NAME="${GITEA_REF#refs/tags/}"
          if [ "$TAG_NAME" = "$GITEA_REF" ]; then
            echo "Expected tag ref, got: $GITEA_REF" >&2
            exit 1
          fi

          if ! printf '%s\n' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare image metadata
        id: image
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          REGISTRY_IMAGE_CV_PROCESSOR: ${{ vars.REGISTRY_IMAGE_CV_PROCESSOR }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -eu
          : "${TAG_NAME:?Missing tag name}"
          : "${REGISTRY_IMAGE_CV_PROCESSOR:?Missing REGISTRY_IMAGE_CV_PROCESSOR variable}"
          : "${REGISTRY_USERNAME:?Missing REGISTRY_USERNAME secret}"
          : "${REGISTRY_PASSWORD:?Missing REGISTRY_PASSWORD secret}"

          REGISTRY_IMAGE_CV_PROCESSOR="$(printf '%s' "$REGISTRY_IMAGE_CV_PROCESSOR" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          REGISTRY_USERNAME="$(printf '%s' "$REGISTRY_USERNAME" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          REGISTRY_PASSWORD="$(printf '%s' "$REGISTRY_PASSWORD" | tr -d '\r')"

          REGISTRY_HOST="${REGISTRY_IMAGE_CV_PROCESSOR%%/*}"
          if [ -z "$REGISTRY_HOST" ] || [ "$REGISTRY_HOST" = "$REGISTRY_IMAGE_CV_PROCESSOR" ]; then
            echo "REGISTRY_IMAGE_CV_PROCESSOR must include a registry host prefix, got: $REGISTRY_IMAGE_CV_PROCESSOR" >&2
            exit 1
          fi

          echo "::add-mask::$REGISTRY_USERNAME"
          echo "::add-mask::$REGISTRY_PASSWORD"

          {
            printf 'image_ref=%s\n' "${REGISTRY_IMAGE_CV_PROCESSOR}:${TAG_NAME}"
            printf 'registry_host=%s\n' "$REGISTRY_HOST"
          } >> "$GITHUB_OUTPUT"

      - name: Run Go tests
        run: go test ./...

      - name: Log in to registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -eu
          : "${REGISTRY_USERNAME:?Missing REGISTRY_USERNAME secret}"
          : "${REGISTRY_PASSWORD:?Missing REGISTRY_PASSWORD secret}"
          REGISTRY_USERNAME="$(printf '%s' "$REGISTRY_USERNAME" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          REGISTRY_PASSWORD="$(printf '%s' "$REGISTRY_PASSWORD" | tr -d '\r')"
          printf '%s\n' "$REGISTRY_PASSWORD" | docker login "${{ steps.image.outputs.registry_host }}" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push release image
        run: |
          set -eu
          docker build -f Dockerfile -t "${{ steps.image.outputs.image_ref }}" .
          docker push "${{ steps.image.outputs.image_ref }}"

  deploy:
    name: Deploy from registry
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          github-server-url: https://gitea.kzcr.eu

      - name: Ensure SSH client is available
        run: |
          set -eu
          if command -v ssh >/dev/null 2>&1; then
            exit 0
          fi

          apt-get update
          apt-get install -y openssh-client

      - name: Configure SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing DEPLOY_SSH_PRIVATE_KEY secret}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Prepare deploy bundle
        id: bundle
        env:
          IMAGE_REF: ${{ needs.build_and_push.outputs.image_ref }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          OLLAMA_URL: ${{ vars.OLLAMA_URL }}
          MODEL_USED: ${{ vars.MODEL_USED }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -eu
          : "${IMAGE_REF:?Missing built image ref}"
          : "${S3_ENDPOINT:?Missing S3_ENDPOINT variable}"
          : "${OLLAMA_URL:?Missing OLLAMA_URL variable}"
          : "${MODEL_USED:?Missing MODEL_USED variable}"
          : "${REGISTRY_PASSWORD:?Missing REGISTRY_PASSWORD secret}"

          IMAGE_REF="$(printf '%s' "$IMAGE_REF" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          S3_ENDPOINT="$(printf '%s' "$S3_ENDPOINT" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          OLLAMA_URL="$(printf '%s' "$OLLAMA_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          MODEL_USED="$(printf '%s' "$MODEL_USED" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          REGISTRY_PASSWORD="$(printf '%s' "$REGISTRY_PASSWORD" | tr -d '\r')"

          TMP_DIR="$(mktemp -d)"
          cp deploy/compose.yaml "$TMP_DIR/compose.yaml"
          cp deploy/deploy-cv-processor.sh "$TMP_DIR/deploy-cv-processor.sh"
          chmod 700 "$TMP_DIR/deploy-cv-processor.sh"
          cat > "$TMP_DIR/.env.runtime.next" <<EOF
          CV_PROCESSOR_IMAGE=$IMAGE_REF
          S3_ENDPOINT=$S3_ENDPOINT
          TIKA_URL=http://tika:9998
          OLLAMA_URL=$OLLAMA_URL
          MODEL_USED=$MODEL_USED
          EOF
          printf '%s\n' "$REGISTRY_PASSWORD" > "$TMP_DIR/registry-password"
          chmod 600 "$TMP_DIR/registry-password"

          echo "tmp_dir=$TMP_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload deploy bundle
        env:
          TMP_DIR: ${{ steps.bundle.outputs.tmp_dir }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          : "${TMP_DIR:?Missing temp dir}"
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH secret}"

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=/dev/null \
            -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p \"${DEPLOY_PATH}\" \"${DEPLOY_PATH}/logs\""

          scp -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=/dev/null \
            -P "${DEPLOY_PORT:-22}" \
            "$TMP_DIR/compose.yaml" \
            "$TMP_DIR/deploy-cv-processor.sh" \
            "$TMP_DIR/.env.runtime.next" \
            "$TMP_DIR/registry-password" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REGISTRY_HOST: ${{ needs.build_and_push.outputs.registry_host }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          set -eu
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH secret}"
          : "${REGISTRY_HOST:?Missing registry host}"
          : "${REGISTRY_USERNAME:?Missing registry username}"
          REGISTRY_USERNAME="$(printf '%s' "$REGISTRY_USERNAME" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" <<EOF
          set -eu
          cd "${DEPLOY_PATH}"
          trap 'rm -f registry-password' EXIT
          chmod 600 registry-password
          docker login "${REGISTRY_HOST}" -u "${REGISTRY_USERNAME}" --password-stdin < registry-password
          chmod 700 deploy-cv-processor.sh
          ./deploy-cv-processor.sh
          EOF
