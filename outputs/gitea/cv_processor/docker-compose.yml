services:
  tika:
    image: apache/tika:3.3.0.0
    container_name: tika
    restart: unless-stopped

    ports:
      - "${TIKA_PORT:-9998}:9998"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9998/tika || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - kz

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:size=256m,mode=1777

    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  cv-processor:
    build:
      context: .
      dockerfile: Dockerfile

    image: cv-processor:latest
    container_name: cv-processor
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TIKA_URL: "http://tika:9998"
      SERVICE_NAME: "cv-processor"

    depends_on:
      tika:
        condition: service_healthy

    networks:
      - kz

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

networks:
  kz:
    name: kz
    driver: bridge
    external: true