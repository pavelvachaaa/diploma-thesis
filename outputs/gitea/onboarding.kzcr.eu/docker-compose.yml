services:
  frontend:
    container_name: onboarding_kzcr_eu
    image: onboarding-kzcr-eu:${APP_VERSION:-latest}
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-local}

    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3011}:3000"

    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_OLD_SPACE_SIZE:-512}"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    mem_limit: ${FRONTEND_MEMORY_LIMIT:-1g}
    memswap_limit: ${FRONTEND_MEMORY_SWAP_LIMIT:-1g}

    networks:
      - app-network

networks:
  app-network:
    name: app-network
    external: true